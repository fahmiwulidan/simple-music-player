<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Simple Music Player</title>
  </head>
  <body>
    <h1>Avenged Sevenfold</h1>

    <div class="music-container" id="music-container">
      <div class="music-info">
        <h4 id="title"></h4>
        <div class="progress-container" id="progress-container">
          <div class="progress" id="progress"></div>
        </div>
      </div>

      <div class="music-content">
        <div class="img-container">
          <img src="images/Dear Good.jpg" alt="music-cover" id="cover" />
        </div>
        <div class="lyrics-container">
          <p id="lyrics"></p>
          <a href="lyrics.html" id="lyrics-link">
            <i class="fas fa-file-alt" title="Lihat Lirik"></i> Lihat Lirik
          </a>
        </div>
      </div>

      <audio src="music/Dear Good.mp3" id="audio"></audio>

      <div class="navigation">
        <button id="prev" class="action-btn">
          <i class="fas fa-backward"></i>
        </button>
        <button id="play" class="action-btn action-btn-big">
          <i class="fas fa-play"></i>
        </button>
        <button id="next" class="action-btn">
          <i class="fas fa-forward"></i>
        </button>
      </div>
    </div>

    <!-- Copyright -->
    <footer>
      <p>&copy; 2024 fahmii00. All rights reserved.</p>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
